name: check

# Runs both test suites on Windows and macOS. The end-to-end check starts the real app with a local stand-in for the
# model service, so no API key is needed and nothing is spent.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: End-to-end check (starts the app)
        run: npm run check
      - name: Desktop launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Desktop"
          node scripts/make-shortcut.mjs
          bash -n "$HOME/Desktop/桌面宠物.command"
          cat "$HOME/Desktop/桌面宠物.command"
