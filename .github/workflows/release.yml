name: release

# Pushing a version tag (v0.1.0, v0.2.0, ...) builds the installers on Windows and macOS and attaches them to a
# GitHub release for that tag: Desktop-Pet-Setup-<version>.exe, and a .dmg each for Apple silicon and Intel Macs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Desktop Pet $GITHUB_REF_NAME" --notes-file docs/release-notes.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and attach the installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid signing certificate: Windows shows a SmartScreen notice and macOS asks once to allow the app.
          CSC_IDENTITY_AUTO_DISCOVERY: false
